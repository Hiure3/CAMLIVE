name: Build Camera Live Pro

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraLivePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Build Windows app and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows application
        run: dotnet publish windows/CameraLivePro.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppSource="publish" installer\CameraLivePro.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CameraLivePro-Windows-Installer
          path: installer/output/CameraLivePro-Setup-x64.exe
          if-no-files-found: error
      - name: Upload build report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          @"
          Camera Live Pro build report
          Commit: $env:GITHUB_SHA
          Windows publish: completed if this step was reached.
          Installer: generated by Inno Setup.
          Android APK: generated in the separate android job.
          Status: starter MVP; video transport, NDI and virtual webcam are not implemented.
          "@ | Set-Content reports/BUILD-REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CameraLivePro-Build-Reports
          path: reports/BUILD-REPORT.txt
